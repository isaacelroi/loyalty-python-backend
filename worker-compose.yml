services:
  worker:    
    container_name: shopify_worker
    build:
      context: .
      dockerfile: worker-dockerfile
    command: python worker.py # Replace with your worker file
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      MONGODB_URI: ${MONGODB_URI}
    networks:
      - loyalty-net
      
networks:
  loyalty-net:
    external: true